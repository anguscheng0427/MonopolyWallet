<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
    <title>地產大亨電子錢包</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        ios: {
                            blue: '#007AFF',
                            green: '#34C759',
                            red: '#FF3B30',
                            yellow: '#FFCC00',
                            dark: '#1C1C1E',
                            gray: '#8E8E93',
                            lightGray: '#F2F2F7',
                        }
                    },
                    animation: {
                        'slide-up': 'slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1)',
                        'scale-in': 'scaleIn 0.2s cubic-bezier(0.16, 1, 0.3, 1)',
                        'fade-in': 'fadeIn 0.2s ease-out',
                        'bounce-slow': 'bounce 2s infinite',
                        'pulse-fast': 'pulse 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'spin': 'spin 1s linear infinite',
                    },
                    keyframes: {
                        slideUp: {
                            '0%': { transform: 'translateY(100%)' },
                            '100%': { transform: 'translateY(0)' },
                        },
                        scaleIn: {
                            '0%': { transform: 'scale(0.9)', opacity: 0 },
                            '100%': { transform: 'scale(1)', opacity: 1 },
                        },
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' },
                        }
                    }
                }
            }
        }
    </script>

    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Icons (Lucide) -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- QR Libs -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

    <style>
        /* Base Styles */
        body {
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior-y: none;
            user-select: none;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        .ios-safe-top { padding-top: env(safe-area-inset-top); }
        .ios-safe-bottom { padding-bottom: env(safe-area-inset-bottom); }
        
        /* Utilities */
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .h-dvh { height: 100vh; height: 100dvh; }

        /* Scanner Specific Fixes with Digital Zoom Simulation */
        #qr-reader {
            width: 100% !important;
            height: 100% !important;
            border: none !important;
            background: black;
            border-radius: 1rem;
            overflow: hidden;
        }
        #qr-reader video {
            width: 100% !important;
            height: 100% !important;
            object-fit: cover !important;
            border-radius: 1rem;
            /* Digital Zoom for Wide Angle Lenses */
            transform: scale(1.5); 
        }
    </style>
</head>
<body class="bg-[#F2F2F7] dark:bg-[#000000] text-black dark:text-white h-dvh w-screen overflow-hidden transition-colors duration-300">
    <div id="root" class="h-full w-full"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback, useLayoutEffect } = React;

        // --- Configuration & Utils ---
        const INITIAL_BALANCE = 0;
        
        const formatMoney = (amount) => {
            return new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: 0 }).format(amount);
        };

        const formatInputDisplay = (val) => {
            if (!val) return "0";
            if (val.endsWith('.')) {
                const parts = val.split('.');
                return parseInt(parts[0]).toLocaleString() + '.';
            }
            if (val.includes('.')) {
                const parts = val.split('.');
                return parseInt(parts[0]).toLocaleString() + '.' + parts[1];
            }
            return parseInt(val).toLocaleString();
        };

        const generateUUID = () => {
            return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
                var r = Math.random() * 16 | 0, v = c == 'x' ? r : (r & 0x3 | 0x8);
                return v.toString(16);
            });
        };

        const validateName = (name) => {
            return /^[A-Za-z0-9\s]*$/.test(name);
        };

        // --- Custom Modal Component ---
        const Modal = ({ isOpen, type, title, message, onConfirm, onCancel, inputPlaceholder, confirmText = "確定", cancelText = "取消" }) => {
            const [inputValue, setInputValue] = useState("");
            
            useEffect(() => {
                if(isOpen) setInputValue("");
            }, [isOpen]);

            if (!isOpen) return null;

            return (
                <div className="fixed inset-0 z-[100] flex items-center justify-center p-4">
                    <div className="absolute inset-0 bg-black/40 backdrop-blur-sm animate-fade-in" onClick={() => type !== 'alert' && onCancel && onCancel()}></div>
                    <div className="relative bg-white/90 dark:bg-[#1C1C1E]/90 backdrop-blur-xl w-full max-w-[300px] rounded-2xl shadow-2xl overflow-hidden animate-scale-in border border-white/20 dark:border-white/10">
                        <div className="p-6 text-center">
                            <h3 className="text-lg font-semibold mb-2">{title}</h3>
                            <p className="text-sm text-gray-600 dark:text-gray-300 whitespace-pre-line">{message}</p>
                            
                            {type === 'prompt' && (
                                <input 
                                    type="text"
                                    value={inputValue}
                                    onChange={(e) => setInputValue(e.target.value)}
                                    placeholder={inputPlaceholder}
                                    className="mt-4 w-full p-2 bg-gray-100 dark:bg-black/50 rounded-lg border border-gray-200 dark:border-gray-700 focus:outline-none text-center"
                                    autoFocus
                                    inputMode={inputPlaceholder?.includes('金額') || inputPlaceholder?.includes('密碼') ? "numeric" : "text"}
                                />
                            )}
                        </div>
                        <div className="flex border-t border-gray-300/50 dark:border-gray-700/50">
                            {(type === 'confirm' || type === 'prompt') && (
                                <button 
                                    onClick={onCancel}
                                    className="flex-1 py-3 text-ios-blue active:bg-gray-100 dark:active:bg-gray-800 border-r border-gray-300/50 dark:border-gray-700/50 font-medium"
                                >
                                    {cancelText}
                                </button>
                            )}
                            <button 
                                onClick={() => type === 'prompt' ? onConfirm(inputValue) : onConfirm()}
                                className={`flex-1 py-3 text-ios-blue active:bg-gray-100 dark:active:bg-gray-800 font-bold ${type === 'alert' ? 'w-full' : ''}`}
                            >
                                {confirmText}
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        // --- Main App ---
        const App = () => {
            const [userData, setUserData] = useState(null);
            const [history, setHistory] = useState([]);
            const [view, setView] = useState("loading"); 
            const [theme, setTheme] = useState("auto");
            const [tempAmount, setTempAmount] = useState("");
            const [superMode, setSuperMode] = useState(false);
            const [overlay, setOverlay] = useState(null);
            const [scanMode, setScanMode] = useState(null);
            const [installPrompt, setInstallPrompt] = useState(false);
            const [modalConfig, setModalConfig] = useState({ isOpen: false, type: 'alert' });

            useEffect(() => {
                const savedData = localStorage.getItem("monopoly_data_v16");
                const savedTheme = localStorage.getItem("monopoly_theme") || "auto";
                setTheme(savedTheme);

                if (savedData) {
                    const parsed = JSON.parse(savedData);
                    setUserData(parsed.user);
                    setHistory(parsed.history || []);
                    setView("home");
                } else {
                    setView("welcome");
                }

                const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
                if (!isStandalone) setInstallPrompt(true);
            }, []);

            useEffect(() => {
                if (userData) {
                    localStorage.setItem("monopoly_data_v16", JSON.stringify({ user: userData, history }));
                }
            }, [userData, history]);

            useEffect(() => {
                const root = window.document.documentElement;
                const isDark = theme === 'dark' || (theme === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
                if (isDark) root.classList.add('dark');
                else root.classList.remove('dark');
                localStorage.setItem("monopoly_theme", theme);
            }, [theme]);

            useLayoutEffect(() => {
                if (window.lucide) window.lucide.createIcons();
            });

            const showModal = (config) => setModalConfig({ isOpen: true, ...config });
            const closeModal = () => setModalConfig(prev => ({ ...prev, isOpen: false }));

            const toggleTheme = () => {
                const modes = ['auto', 'light', 'dark'];
                const next = modes[(modes.indexOf(theme) + 1) % modes.length];
                setTheme(next);
            };

            const getThemeIcon = () => {
                if (theme === 'auto') return 'smartphone';
                if (theme === 'light') return 'sun';
                return 'moon';
            };

            const handleRestartGame = () => {
                showModal({
                    type: 'confirm',
                    title: '重新開始',
                    message: '確定要開始新的一局嗎？\n目前的財產紀錄將被覆蓋。',
                    onConfirm: () => {
                        closeModal();
                        const newUser = {
                            ...userData,
                            balance: INITIAL_BALANCE,
                            status: 'active',
                            processedIds: [],
                            settledAssets: 0
                        };
                        setUserData(newUser);
                        setHistory([]);
                        setView("home");
                    },
                    onCancel: closeModal
                });
            };

            const handleTransaction = (amount, type, description, targetName) => {
                const numAmount = parseInt(amount);
                if (isNaN(numAmount) || numAmount <= 0) return false;

                let newBalance = userData.balance;
                let newStatus = userData.status;

                if (type === 'pay') {
                    newBalance -= numAmount;
                    if (newBalance < 0) {
                        newStatus = 'bankrupt';
                    }
                } else {
                    newBalance += numAmount;
                }

                const record = {
                    id: generateUUID(),
                    type,
                    amount: numAmount,
                    description,
                    target: targetName,
                    timestamp: Date.now()
                };

                setUserData(prev => ({ ...prev, balance: newBalance, status: newStatus }));
                setHistory(prev => [record, ...prev]);

                if (newStatus === 'bankrupt') {
                    setOverlay(null);
                    setView('home');
                }

                return true;
            };

            const handleNumpadConfirm = () => {
                const val = parseInt(parseFloat(tempAmount));
                if (!val) return showModal({ type: 'alert', title: '錯誤', message: '請輸入有效金額', onConfirm: closeModal });

                if (overlay.type === 'pay_input') {
                    if (userData.balance - val < 0) {
                        showModal({
                            type: 'confirm',
                            title: '破產警告',
                            message: `支付此金額 (${formatMoney(val)}) 將導致餘額不足！\n您確定要宣告破產嗎？`,
                            confirmText: "宣告破產",
                            cancelText: "取消交易",
                            onConfirm: () => {
                                closeModal();
                                handleTransaction(val, 'pay', '支付並破產', '未知');
                            },
                            onCancel: closeModal
                        });
                        return;
                    }
                    setOverlay(prev => ({ ...prev, step: 'choose_target', amount: val }));

                } else if (overlay.type === 'bank_static_input') {
                    handleTransaction(val, 'receive', '銀行臨櫃提款', '銀行');
                    setOverlay({ 
                        type: 'success_msg', 
                        title: '提款成功', 
                        msg: `已從銀行領取`,
                        amount: val,
                        sub: '請出示畫面供檢查',
                        theme: 'green'
                    });
                }
            };

            const generatePayQR = () => {
                const val = overlay.amount;
                // CHANGED: Description '轉帳給其他人'
                if (handleTransaction(val, 'pay', '轉帳給其他人', '轉帳')) {
                    const payload = {
                        type: 'p2p_transfer',
                        sender: userData.name,
                        amount: val,
                        timestamp: Date.now(),
                        id: generateUUID()
                    };
                    setOverlay({ 
                        type: 'show_qr', 
                        payload: payload, 
                        label: formatMoney(val), 
                        subLabel: "請對方掃描收款", 
                        icon: 'user' 
                    });
                }
            };

            const payToBank = () => {
                const val = overlay.amount;
                if (handleTransaction(val, 'pay', '支付給銀行', '銀行')) {
                    setOverlay({ 
                        type: 'success_msg', 
                        title: '支付成功', 
                        msg: `已支付給銀行`, 
                        amount: val,
                        sub: '請出示畫面供檢查',
                        theme: 'rose' // CHANGED: Softer red (Rose)
                    });
                }
            };

            const onScanSuccess = (decodedText) => {
                setScanMode(null);
                try {
                    const data = JSON.parse(decodedText);
                    const now = Date.now();

                    if (scanMode === 'bank_auth') {
                        if (data.action === 'bank_auth' || data.type === 'bank_auth_key') {
                            setView('bank_mode');
                        } else {
                            showModal({ type: 'alert', title: '錯誤', message: '無效的銀行權限 QR Code', onConfirm: closeModal });
                        }
                        return;
                    }

                    if (data.timestamp && (now - data.timestamp > 300000)) {
                        throw new Error("QR Code 已過期 (超過5分鐘)");
                    }
                    if (data.id && userData.processedIds.includes(data.id)) {
                        throw new Error("此交易已處理過");
                    }

                    if (data.type === 'p2p_transfer') {
                        handleTransaction(data.amount, 'receive', `來自 ${data.sender}`, data.sender);
                        setUserData(prev => ({...prev, processedIds: [...prev.processedIds, data.id]}));
                        setOverlay({ type: 'success_msg', title: '收款成功', msg: `來自 ${data.sender}`, amount: data.amount, theme: 'green', sub: '已存入錢包' });
                    
                    } else if (data.type === 'bank_withdraw') {
                        handleTransaction(data.amount, 'receive', '銀行撥款', '銀行');
                        setUserData(prev => ({...prev, processedIds: [...prev.processedIds, data.id]}));
                        setOverlay({ type: 'success_msg', title: '收款成功', msg: `銀行撥款`, amount: data.amount, theme: 'green', sub: '已存入錢包' });
                    
                    } else if (data.action === 'bank_static' || (data.amount === null && !data.sender)) {
                        setTempAmount("");
                        setOverlay({ type: 'bank_static_input' });
                    } else {
                        throw new Error("未知的 QR 格式");
                    }

                } catch (err) {
                    showModal({ type: 'alert', title: '掃描失敗', message: err.message || "無法讀取 QR Code", onConfirm: closeModal });
                }
            };

            const enterBankMode = () => {
                showModal({
                    type: 'prompt',
                    title: '銀行模式',
                    message: '請輸入銀行密碼 (0000)\n或掃描授權 QR',
                    inputPlaceholder: '密碼',
                    confirmText: '登入',
                    cancelText: '掃描',
                    onConfirm: (pw) => {
                        if (pw === '0000') {
                            closeModal();
                            setView('bank_mode');
                        } else {
                            closeModal();
                            showModal({ type: 'alert', title: '錯誤', message: '密碼錯誤', onConfirm: closeModal });
                        }
                    },
                    onCancel: () => {
                        closeModal();
                        setScanMode('bank_auth');
                    }
                });
            };

            const handleDevDeposit = () => {
                showModal({
                    type: 'prompt',
                    title: '開發者功能',
                    message: '請輸入開發者密碼',
                    inputPlaceholder: '密碼',
                    onConfirm: (pw) => {
                        if (pw === '8888') {
                            closeModal();
                            setTimeout(() => {
                                showModal({
                                    type: 'prompt',
                                    title: '開發者儲值',
                                    message: '輸入要增加的金額',
                                    inputPlaceholder: '金額',
                                    onConfirm: (amt) => {
                                        const val = parseInt(amt);
                                        if (val) handleTransaction(val, 'receive', '開發者指令', 'SYSTEM');
                                        closeModal();
                                    },
                                    onCancel: closeModal
                                });
                            }, 300);
                        } else {
                            closeModal();
                        }
                    },
                    onCancel: closeModal
                });
            };

            const Numpad = ({ onConfirm, label = "確定" }) => {
                const add = (d) => setTempAmount(prev => {
                    if (d === '.' && prev.includes('.')) return prev;
                    if (d === '.' && prev === '') return "0.";
                    return prev + d;
                });
                
                const multi = (m) => setTempAmount(prev => {
                    if(!prev) return prev;
                    const val = parseFloat(prev);
                    if (isNaN(val)) return prev;
                    return (val * m).toString();
                });
                
                const del = () => setTempAmount(prev => {
                    if(prev.length <= 1) return "";
                    return prev.slice(0,-1);
                });

                const clear = () => setTempAmount("");

                return (
                    <div className="bg-gray-100 dark:bg-[#1C1C1E] border-t border-gray-200 dark:border-gray-800 p-4 rounded-t-3xl shadow-[0_-4px_20px_rgba(0,0,0,0.1)]">
                        <div className="bg-white dark:bg-black text-black dark:text-white border-gray-200 dark:border-gray-800 p-4 rounded-xl mb-4 text-right text-3xl font-mono shadow-inner border h-16 flex items-center justify-end font-bold tracking-wider">
                            {formatInputDisplay(tempAmount)}
                        </div>
                        <div className="grid grid-cols-3 gap-3 mb-2">
                            {[1,2,3,4,5,6,7,8,9].map(n => (
                                <button key={n} onClick={()=>add(n)} className="bg-white dark:bg-[#2C2C2E] text-black dark:text-white p-4 rounded-xl text-xl font-bold shadow-sm active:scale-95 transition-transform">{n}</button>
                            ))}
                            {!superMode && (
                                <>
                                    <button onClick={clear} className="bg-red-100 dark:bg-red-900/30 text-red-500 p-4 rounded-xl text-lg font-bold shadow-sm">C</button>
                                    <button onClick={()=>add(0)} className="bg-white dark:bg-[#2C2C2E] text-black dark:text-white p-4 rounded-xl text-xl font-bold shadow-sm active:scale-95 transition-transform">0</button>
                                    <button onClick={del} className="bg-gray-200 dark:bg-[#3A3A3C] text-black dark:text-white p-4 rounded-xl text-xl font-bold shadow-sm flex items-center justify-center"><i data-lucide="delete"></i></button>
                                </>
                            )}
                            {superMode && (
                                <>
                                    <button onClick={()=>add('.')} className="bg-white dark:bg-[#2C2C2E] text-black dark:text-white p-4 rounded-xl text-xl font-bold shadow-sm active:scale-95 transition-transform">.</button>
                                    <button onClick={()=>add(0)} className="bg-white dark:bg-[#2C2C2E] text-black dark:text-white p-4 rounded-xl text-xl font-bold shadow-sm active:scale-95 transition-transform">0</button>
                                    <button onClick={del} className="bg-gray-200 dark:bg-[#3A3A3C] text-black dark:text-white p-4 rounded-xl text-xl font-bold shadow-sm flex items-center justify-center"><i data-lucide="delete"></i></button>
                                </>
                            )}
                        </div>

                        {superMode && (
                            <div className="grid grid-cols-3 gap-3 mb-3">
                                <button onClick={clear} className="bg-red-100 dark:bg-red-900/30 text-red-500 p-4 rounded-xl text-lg font-bold shadow-sm">C</button>
                                <button onClick={()=>multi(1000000)} className="bg-yellow-100 dark:bg-yellow-900/30 text-yellow-700 dark:text-yellow-400 p-3 rounded-xl font-bold">M</button>
                                <button onClick={()=>multi(1000)} className="bg-yellow-100 dark:bg-yellow-900/30 text-yellow-700 dark:text-yellow-400 p-3 rounded-xl font-bold">K</button>
                            </div>
                        )}
                        <button onClick={onConfirm} className="w-full bg-ios-blue text-white py-4 rounded-xl text-xl font-bold shadow-lg shadow-blue-500/30 active:scale-95 transition-transform">
                            {label}
                        </button>
                    </div>
                );
            };

            const QRDisplay = ({ value, label, sub, icon, showExpiry = true }) => {
                const qrRef = useRef();
                useEffect(() => {
                    if (qrRef.current) {
                        qrRef.current.innerHTML = "";
                        new QRCode(qrRef.current, {
                            text: typeof value === 'string' ? value : JSON.stringify(value),
                            width: 256,
                            height: 256,
                            colorDark : "#000000",
                            colorLight : "#ffffff",
                            correctLevel : QRCode.CorrectLevel.H
                        });
                    }
                }, [value]);
                return (
                    <div className="bg-white p-6 rounded-3xl shadow-2xl flex flex-col items-center max-w-sm mx-auto animate-scale-in">
                        <h3 className="text-xl font-bold text-black mb-2">{label}</h3>
                        <div className="relative my-4">
                            <div ref={qrRef} className="p-2 border-2 border-gray-100 rounded-xl"></div>
                            <div className="absolute inset-0 flex items-center justify-center">
                                <div className="bg-white p-1 rounded-full shadow-lg flex items-center justify-center">
                                    <i data-lucide={icon} className={`w-8 h-8 ${icon==='landmark'?'text-yellow-500 fill-yellow-500':'text-ios-blue fill-ios-blue'}`}></i>
                                </div>
                            </div>
                        </div>
                        <p className="text-gray-500 text-sm">{sub}</p>
                        {showExpiry && <p className="text-xs text-red-400 mt-2">有效期限 5 分鐘</p>}
                    </div>
                );
            };

            const ScannerController = ({ onScan, onClose }) => {
                const [error, setError] = useState(null);
                const [isProcessing, setIsProcessing] = useState(false);

                useEffect(() => {
                    const html5QrCode = new Html5Qrcode("qr-reader");
                    
                    const config = { 
                        fps: 15, 
                        qrbox: { width: 250, height: 250 }, 
                        aspectRatio: 1.0, 
                        videoConstraints: { facingMode: "environment" }
                    };
                    
                    html5QrCode.start(
                        { facingMode: "environment" },
                        config,
                        (decodedText) => {
                            setIsProcessing(true); 
                            html5QrCode.pause(); 
                            setTimeout(() => {
                                html5QrCode.stop().then(() => {
                                    onScan(decodedText);
                                }).catch(err => console.error("Stop failed", err));
                            }, 500);
                        },
                        (errorMessage) => { }
                    ).catch(err => {
                        console.error("Camera error", err);
                        setError("無法啟動相機。請確認已允許權限，或使用 Safari/Chrome 瀏覽器。");
                    });

                    return () => {
                        if (html5QrCode.isScanning) {
                            html5QrCode.stop().catch(e => console.error("Cleanup stop error", e));
                        }
                    };
                }, []);

                return (
                    <div className="fixed inset-0 z-50 bg-black flex flex-col items-center justify-center">
                        <div className="absolute top-0 left-0 w-full flex justify-between items-center p-4 ios-safe-top text-white z-20">
                             <h3 className="font-bold drop-shadow-md">掃描 QR Code</h3>
                             <button onClick={onClose} className="p-2 bg-white/20 backdrop-blur-md rounded-full flex items-center justify-center"><i data-lucide="x"></i></button>
                        </div>

                        <div className="relative w-[300px] h-[300px] bg-black rounded-3xl overflow-hidden border-2 border-white/50 shadow-2xl">

                                type="text" 
                                placeholder="輸入玩家名稱 (英文/數字)" 
                                className={`w-full p-4 bg-white/50 dark:bg-black/30 rounded-2xl text-center text-lg backdrop-blur-md border ${error ? 'border-red-500 focus:ring-red-500' : 'border-gray-200 dark:border-gray-700 focus:ring-ios-blue'} focus:ring-2 outline-none placeholder-gray-400 text-black dark:text-white transition-all`}
                                autoFocus 
                            />
                            {error && <p className="text-red-500 text-xs text-center mt-2">{error}</p>}
                        </div>
                        <button 
                            type="submit" 
                            disabled={!name || !!error}
                            className="w-full bg-ios-blue text-white py-4 rounded-2xl font-bold shadow-lg shadow-blue-500/30 active:scale-95 transition-transform disabled:opacity-50 disabled:active:scale-100"
                        >
                            開始遊戲
                        </button>
                    </form>
                </div>
            );
        };
        
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
